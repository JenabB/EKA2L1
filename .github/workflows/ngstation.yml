name: NGStation APK

on:
  push:
    branches: [ngstation, master, main]
  workflow_dispatch:

concurrency:
  group: ngstation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/emu/android

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential libc6-dev

    - name: Identify FFmpeg cache
      id: ffmpeg
      run: |
        echo "revision=$(git -C ../../external/ffmpeg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Cache FFmpeg
      uses: actions/cache@v4
      with:
        path: build/ffmpeg-cache
        key: ffmpeg-android-${{ steps.ffmpeg.outputs.image }}-${{ steps.ffmpeg.outputs.revision }}-${{ hashFiles('src/emu/android/app/build.gradle') }}

    - name: Build APK
      run: ./gradlew assembleRelease -PciArg='-DCI=ON'

    - name: Collect APK
      id: apk
      run: |
        SHA=$(git rev-parse --short HEAD)
        cp app/build/outputs/apk/release/app-release.apk "${GITHUB_WORKSPACE}/NGStation-${SHA}.apk"
        cp app/build/outputs/apk/release/app-release.apk "${GITHUB_WORKSPACE}/NGStation.apk"
        echo "name=NGStation-${SHA}.apk" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.apk.outputs.name }}
        path: ${{ steps.apk.outputs.name }}

    # A rolling pre-release, so the newest APK can be downloaded straight from a phone.
    - name: Publish to "latest" release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ngstation-latest
        name: NGStation (build terbaru)
        prerelease: true
        files: NGStation.apk
        body: |
          Build otomatis dari commit ${{ github.sha }}.
          Unduh file .apk di bawah lalu pasang di HP Android.
